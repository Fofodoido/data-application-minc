[tool.poetry]
package-mode = false
name = "lappis"
version = "0.1.0"
description = "Gestão de Dados do IPEA - Aplicações Python"
authors = ["Lappis UNB"]
readme = "README.md"

[tool.poetry.dependencies]
python = "~3.11"
# Versoes iguais as de infra/docker/airflow/requirements.lock.txt, que e o que
# roda em producao. tests/test_dependencias_sincronizadas.py reprova divergencia.
apache-airflow = "3.2.2"
apache-airflow-providers-amazon = "9.35.0"
apache-airflow-providers-microsoft-mssql = "4.7.0"
pymssql = "2.3.13"
apache-airflow-providers-postgres = "6.7.0"
apache-airflow-providers-trino = "6.6.1"
apache-airflow-providers-standard = "1.13.1"
numpy = "1.26.4"
dbt-core = "1.10.23"
dbt-postgres = "1.10.0"
pandas = "2.1.4"
requests = "2.34.2"
zeep = "4.3.3"
imap-tools = "1.10.0"
astronomer-cosmos = "1.15.1"
aiohttp = "3.14.3"
openpyxl = "3.1.5"
pyarrow = "25.0.1"
odfpy = "1.4.1"
python-calamine = "0.6.2"

[tool.poetry.group.dev.dependencies]
# edita o YAML do dbt a partir de sugestão do OpenMetadata
# (scripts/aplicar_sugestao.py); o workflow instala por conta própria
ruamel-yaml = ">=0.18,<0.20"
black = "*"
ruff = "*"
pytest = "*"
pytest-cov = "*"
mypy = "*"
types-psycopg2 = "*"
pandas-stubs = "*"
sqlalchemy-stubs = "*"
shandy-sqlfmt = "*"
sqlfluff = "*"
sqlfluff-templater-dbt = "*"
types-Authlib = "*"
types-Deprecated = "*"
types-Pygments = "*"
types-WTForms = "*"
types-croniter = "*"
types-gevent = "*"
types-jmespath = "*"
types-jsonschema = "*"
types-openpyxl = "*"
types-psutil = "*"
types-tabulate = "*"
types-colorama = "*"
types-decorator = "*"
types-passlib = "*"
types-pycurl = "*"
types-simplejson = "*"
types-uWSGI = "*"


[tool.poetry.group.docs.dependencies]
pyyaml = "^6.0.3"
python-docx = "^1.2.0"
beautifulsoup4 = "^4.15.0"
lxml = "^6.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 90
target-version = ["py311"]
skip-string-normalization = false
include = "\\.pyi?$"
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.conda
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 90
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "migrations",
    "build",
    "dist",
    "*.pyi",
    ".ipynb_checkpoints",
    "*.ipynb"
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = []

[tool.mypy]
python_version = "3.11"
files = ["**/*.py"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
follow_untyped_imports = true
disable_error_code = ["arg-type", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Mesmos diretórios que o Makefile exporta em PYTHONPATH. O Airflow importa
# plugins/ e helpers/ como módulos de topo (sem pacote), então um teste que
# importa `cliente_bacen` só resolve com esses caminhos no sys.path — no CI,
# importa `territorio_ibge` só resolve com esses caminhos no sys.path — no CI,
# que chama `pytest` direto, o export do Makefile não existe.
pythonpath = ["plugins", "helpers", "dags"]

[tool.sqlfmt]
line_length = 90
dialect = "polyglot"
exclude = [
    ".git/",
    ".venv/",
    "build/",
    "dist/",
    "**/target/**",
    "**/compiled/**"
]

[tool.sqlfluff.core]
dialect = "postgres"
templater = "dbt"
max_line_length = 90
exclude_rules = "L016,LT02,LT09,LT14,RF02,AL04,CV08"
verbose = 1

[tool.sqlfluff.indentation]
indented_joins = true
indented_using_on = true
template_blocks_indent = true
indent_unit = "space"
tab_space_size = 2

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.identifiers]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.literals]
capitalisation_policy = "lower"

[tool.sqlfluff.templater]
unwrap_wrapped_queries = true

[tool.sqlfluff.templater.dbt]
project_dir = "./dbt/minc"
profiles_dir = "./dbt/minc"
profile = "minc"
target = "prod"
defer_mode = true
static_analysis = true
disable_database_connection = true
