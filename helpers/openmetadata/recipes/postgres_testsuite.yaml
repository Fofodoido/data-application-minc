source:
  type: testsuite
  # Em suíte LÓGICA, o serviceName é o nome da suíte, não do serviço de banco:
  # o source a procura por nome e agrupa os casos por tabela. Precisa casar com
  # `suite_de_execucao.name` em dbt/minc/governance/qualidade.yml.
  serviceName: minc_testes_nativos
  sourceConfig:
    config:
      type: TestSuite
      # A conexão vem daqui, e não da que o serviço guarda: as recipes do MinC
      # não persistem conexão na instância (sem `storeServiceConnection`).
      serviceConnections:
        - serviceName: MinC
          serviceConnection:
            config:
              type: Postgres
              hostPort: ${DB_DW_HOST}:${DB_DW_PORT}
              username: ${DB_DW_USER}
              authType:
                password: ${DB_DW_PASSWORD}
              database: ${DB_DW_DBNAME}
              sslMode: disable

processor:
  type: orm-test-runner
  config: {}

sink:
  type: metadata-rest
  config:
    # Lote pequeno de proposito: o proxy na frente do OpenMetadata corta a
    # conexao antes de um PUT grande terminar.
    bulk_sink_batch_size: 10

workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: ${OM_HOST}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${INGESTION_TOKEN}
