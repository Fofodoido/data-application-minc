source:
  type: postgres
  serviceName: MinC
  serviceConnection:
    config:
      type: Postgres
      hostPort: ${DB_DW_HOST}:${DB_DW_PORT}
      username: ${DB_DW_USER}
      authType:
        password: ${DB_DW_PASSWORD}
      database: ${DB_DW_DBNAME}
      sslMode: disable

  sourceConfig:
    config:
      type: DatabaseMetadata
      includeTables: true
      includeViews: true
      # O default e `true`, e ele apaga catalogo. Rodar esta recipe contra um
      # banco incompleto -- ambiente restaurado pela metade, VPN caindo no meio
      # da carga, schema ainda nao materializado -- marca como deletado tudo
      # que o catalogo tem e o banco nao, sem nenhum aviso. Com 571 modelos
      # SALIC materializados como view, uma carga parcial custaria o catalogo
      # inteiro. Tabela removida de verdade sai do catalogo a mao; e mais
      # barato que a alternativa.
      #
      # So aqui: profiler e classifier nao sao `DatabaseMetadata` e nao apagam
      # nada. tests/test_openmetadata_packaging.py guarda as duas coisas.
      markDeletedTables: false
      schemaFilterPattern:
        includes:
          # Uniao do que o projeto dbt declara como source com o que ele
          # produz. tests/test_openmetadata_packaging.py deriva a mesma lista
          # do projeto dbt e falha quando as duas divergem.
          - '^agentes$'
          - '^ancine$'
          - '^bacen$'
          - '^bb_agil$'
          - '^bbagil$'
          - '^bbagil_bronze$'
          - '^bronze$'
          - '^bsc$'
          - '^bsc_pnab$'
          - '^cotas$'
          - '^dados_mapa_cultura$'
          - '^dados_salic$'
          - '^execucao_pnab$'
          - '^ibge_sidra$'
          - '^mapas$'
          - '^metadata$'
          - '^relatorio_gestao$'
          - '^salic$'
          - '^salic_bronze$'
          - '^transferegov$'
          - '^transferegov_bronze$'
      # Sem tableFilterPattern: a decisao foi ingerir tudo dos schemas acima,
      # inclusive o que ainda esta mal documentado, para o catalogo mostrar o
      # estado real e orientar o que documentar primeiro.

sink:
  type: metadata-rest
  config:
    # Lote pequeno de proposito: o proxy na frente do OpenMetadata corta a
    # conexao antes de um PUT grande terminar.
    bulk_sink_batch_size: 10

workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: ${OM_HOST}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${INGESTION_TOKEN}
