version: 2

# ibge_sidra, na estrutura do ADR 0010: bronze_<tabela> é a cópia fiel do que a
# ibge_agregados_dag grava em ibge_sidra.<tabela>; silver_<tabela> tipa.
models:
  - name: bronze_agregados_catalogo
    description: >
      Camada Bronze — cópia fiel de ibge_sidra.agregados_catalogo, sem cast, filtro nem join
      (ADR 0010). Todas as colunas chegam como na origem.
    config:
      tags:
        - bronze
        - ibge_sidra
    meta:
      openmetadata:
        domain: Cultura.Indicadores
        tier: Tier.Tier3
        owner: minc-data-engineering

  - name: bronze_localidades
    description: >
      Camada Bronze — cópia fiel de ibge_sidra.localidades, sem cast, filtro nem join
      (ADR 0010). Todas as colunas chegam como na origem.
    config:
      tags:
        - bronze
        - ibge_sidra
    meta:
      openmetadata:
        domain: Cultura.Indicadores
        tier: Tier.Tier3
        owner: minc-data-engineering

  - name: bronze_metadados
    description: >
      Camada Bronze — cópia fiel de ibge_sidra.metadados, sem cast, filtro nem join
      (ADR 0010). Todas as colunas chegam como na origem.
    config:
      tags:
        - bronze
        - ibge_sidra
    meta:
      openmetadata:
        domain: Cultura.Indicadores
        tier: Tier.Tier3
        owner: minc-data-engineering

  - name: bronze_periodos
    description: >
      Camada Bronze — cópia fiel de ibge_sidra.periodos, sem cast, filtro nem join
      (ADR 0010). Todas as colunas chegam como na origem.
    config:
      tags:
        - bronze
        - ibge_sidra
    meta:
      openmetadata:
        domain: Cultura.Indicadores
        tier: Tier.Tier3
        owner: minc-data-engineering

  - name: bronze_pesquisas
    description: >
      Camada Bronze — cópia fiel de ibge_sidra.pesquisas, sem cast, filtro nem join
      (ADR 0010). Todas as colunas chegam como na origem.
    config:
      tags:
        - bronze
        - ibge_sidra
    meta:
      openmetadata:
        domain: Cultura.Indicadores
        tier: Tier.Tier3
        owner: minc-data-engineering

  - name: silver_agregados_catalogo
    description: >
      Catálogo das tabelas (agregados) publicadas no SIDRA, o banco de tabelas do
      IBGE, tipado. Uma linha por agregado (`id`), com a pesquisa a que ele
      pertence. O teste `unique` confere esse grão, como aviso (`warn`) até a #100:
      a carga da ibge_agregados_dag acrescenta linhas em vez de substituir, e o
      homolog tem cerca de 9 cópias de cada linha. O grão é o esperado, não o
      garantido. Vem do GET /agregados da API de Agregados v3, achatado pela
      ibge_agregados_dag. Lida de bronze_agregados_catalogo.
    config:
      tags:
        - silver
        - ibge_sidra
      meta:
        status: Active
        origem_dados: 'bronze_agregados_catalogo'
        openmetadata:
          domain: Cultura.Indicadores
          tier: Tier.Tier2
          owner: minc-data-engineering
    columns:
      - name: id
        description: >
          Código do agregado (a "tabela" do SIDRA). Chave da tabela e o mesmo
          código usado em agregado_id nas outras tabelas do schema.
        data_type: integer
        tests:
          # warn até a #100: a ibge_agregados_dag duplica linhas (cerca de 9 cópias no homolog)
          - unique:
              config:
                severity: warn
      - name: nome
        description: >
          Título do agregado, como o IBGE publica.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: pesquisa_id
        description: >
          Código de duas letras da pesquisa do IBGE a que o agregado pertence.
          Liga com silver_pesquisas.id.
        data_type: text
      - name: pesquisa_nome
        description: >
          Nome da pesquisa do IBGE a que o agregado pertence.
        data_type: text

  - name: silver_localidades
    description: >
      Localidades em que cada agregado do SIDRA tem dado, tipadas. Uma linha por
      agregado e localidade (`agregado_id` + `id`). O teste `unique` confere esse
      grão, como aviso (`warn`) até a #100: a carga da ibge_agregados_dag acrescenta
      linhas em vez de substituir, e o homolog tem cerca de 9 cópias de cada linha.
      O grão é o esperado, não o garantido. Vem do GET
      /agregados/{id}/localidades/{nivel}; a ibge_agregados_dag só pede o nível N3
      (Unidade da Federação), então `id` é sempre o código de UF do IBGE. Agregado
      sem recorte por UF não aparece. Lida de bronze_localidades.
    config:
      tags:
        - silver
        - ibge_sidra
      meta:
        status: Active
        origem_dados: 'bronze_localidades'
        openmetadata:
          domain: Cultura.Indicadores
          tier: Tier.Tier2
          owner: minc-data-engineering
    tests:
      # warn até a #100: a ibge_agregados_dag duplica linhas (cerca de 9 cópias no homolog)
      - unique:
          column_name: "agregado_id || '-' || id"
          config:
            severity: warn
    columns:
      - name: agregado_id
        description: >
          Código do agregado do SIDRA. Liga com silver_agregados_catalogo.id.
        data_type: integer
      - name: nivel
        description: >
          Nível geográfico da localidade, em JSON como a API devolve (id e nome
          do nível). Hoje é sempre N3, Unidade da Federação.
        data_type: text
      - name: id
        description: >
          Código IBGE da localidade. No nível N3, o código de dois dígitos da UF.
        data_type: integer
      - name: nome
        description: >
          Nome da localidade (no nível N3, o nome da UF).
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive

  - name: silver_metadados
    description: >
      Metadados de cada agregado do SIDRA, tipados: pesquisa, assunto,
      periodicidade, níveis territoriais, variáveis e classificações. Uma linha
      por agregado. Vem do GET /agregados/{id}/metadados; os campos que a API
      devolve como lista ou objeto chegam como texto JSON. Lida de
      bronze_metadados.
    config:
      tags:
        - silver
        - ibge_sidra
      meta:
        status: Active
        origem_dados: 'bronze_metadados'
        openmetadata:
          domain: Cultura.Indicadores
          tier: Tier.Tier2
          owner: minc-data-engineering
    columns:
      - name: agregado_id
        description: >
          Código do agregado pedido à API. Chave da tabela; liga com
          silver_agregados_catalogo.id.
        data_type: integer
        tests:
          - unique
      - name: id
        description: >
          Código do agregado como a API devolve no corpo da resposta. Igual a
          agregado_id.
        data_type: integer
      - name: nome
        description: >
          Título do agregado.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: url
        description: >
          Endereço da tabela no site do SIDRA.
        data_type: text
      - name: pesquisa
        description: >
          Nome da pesquisa do IBGE a que o agregado pertence.
        data_type: text
      - name: assunto
        description: >
          Assunto do agregado, na classificação do IBGE.
        data_type: text
      - name: periodicidade
        description: >
          Frequência da tabela e primeiro e último período publicados, em JSON.
        data_type: text
      - name: nivelterritorial
        description: >
          Níveis geográficos em que o agregado tem dado (N1 Brasil, N3 UF, N6
          município...), em JSON, separados em administrativos, especiais e do
          IBGE.
        data_type: text
      - name: variaveis
        description: >
          Lista das variáveis medidas pelo agregado, com código, nome e unidade,
          em JSON.
        data_type: text
      - name: classificacoes
        description: >
          Lista das classificações (recortes como sexo, idade, atividade) e das
          suas categorias, em JSON. Pode passar de 500 mil caracteres.
        data_type: text

  - name: silver_periodos
    description: >
      Períodos disponíveis em cada agregado do SIDRA, tipados. Uma linha por
      agregado e período (`agregado_id` + `id`). O teste `unique` confere esse grão,
      como aviso (`warn`) até a #100: a carga da ibge_agregados_dag acrescenta
      linhas em vez de substituir, e o homolog tem cerca de 9 cópias de cada linha.
      O grão é o esperado, não o garantido. Vem do GET /agregados/{id}/periodos.
      Lida de bronze_periodos.
    config:
      tags:
        - silver
        - ibge_sidra
      meta:
        status: Active
        origem_dados: 'bronze_periodos'
        openmetadata:
          domain: Cultura.Indicadores
          tier: Tier.Tier2
          owner: minc-data-engineering
    tests:
      # warn até a #100: a ibge_agregados_dag duplica linhas (cerca de 9 cópias no homolog)
      - unique:
          column_name: "agregado_id || '-' || id"
          config:
            severity: warn
    columns:
      - name: agregado_id
        description: >
          Código do agregado do SIDRA. Liga com silver_agregados_catalogo.id.
        data_type: integer
      - name: id
        description: >
          Código do período no SIDRA: o ano (aaaa) ou o ano seguido do mês ou do
          trimestre (aaaamm), conforme a periodicidade do agregado.
        data_type: integer
      - name: literals
        description: >
          Rótulos do período, em JSON, como a API devolve.
        data_type: text
      - name: modificacao
        description: >
          Data da última modificação do período no SIDRA. Mantida como texto,
          como chega da API.
        data_type: text

  - name: silver_pesquisas
    description: >
      Pesquisas do IBGE que têm tabelas no SIDRA. Uma linha por pesquisa (`id`). O
      teste `unique` confere esse grão, como aviso (`warn`) até a #100: a carga da
      ibge_agregados_dag acrescenta linhas em vez de substituir, e o homolog tem
      cerca de 9 cópias de cada linha. O grão é o esperado, não o garantido. Vem do
      GET /agregados. Lida de bronze_pesquisas; nenhuma coluna precisou de cast.
    config:
      tags:
        - silver
        - ibge_sidra
      meta:
        status: Active
        origem_dados: 'bronze_pesquisas'
        openmetadata:
          domain: Cultura.Indicadores
          tier: Tier.Tier2
          owner: minc-data-engineering
    columns:
      - name: id
        description: >
          Código de duas letras da pesquisa. Chave da tabela; liga com
          silver_agregados_catalogo.pesquisa_id.
        data_type: text
        tests:
          # warn até a #100: a ibge_agregados_dag duplica linhas (cerca de 9 cópias no homolog)
          - unique:
              config:
                severity: warn
      - name: nome
        description: >
          Nome da pesquisa.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: agregados
        description: >
          Lista dos agregados da pesquisa (código e nome), em JSON. É a mesma
          informação de silver_agregados_catalogo, sem achatar.
        data_type: text
