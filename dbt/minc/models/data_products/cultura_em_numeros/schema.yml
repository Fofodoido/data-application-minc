version: 2

# Cultura em Números, produto de dados (Gold, ADR 0010).
#
# CONVENÇÃO DE NOME DESTE PRODUTO: eixo<N>_meta<M>_<nome>, porque é por eixo e
# meta que a coordenação procura um indicador. A Meta 5 (novos entrantes no
# fomento federal) é do eixo 2.
#
# A regra de negócio da Meta 5 vive toda aqui (ADR 0010). Duas golds são a base
# das outras e não respondem pergunta sozinhas: eixo2_meta5_evento_fomento
# (quem conta, por fonte) e eixo2_meta5_primeiro_acesso_agente (a definição de
# novo entrante). Gold lê Gold só dentro do mesmo produto.
models:
  - name: eixo2_meta5_evento_fomento
    description: >
      Camada Gold — Meta 5. Espinha do indicador: um evento por vez que um
      agente cultural recebeu recurso de uma política federal de fomento, já
      com a política classificada. É a tabela que permite perguntar "este
      agente já havia sido contemplado antes?" acima do mecanismo, que é o
      que a pergunta da meta exige. Grão: 1 linha por (documento, mecanismo,
      data, valor).

      Lê int_ancine_bbagil_salic, que só junta as fontes, e concentra a regra
      de negócio de quem conta (ADR 0010): no BB Ágil, fora repasse a ente
      público, devolução ao FNC, transferência ao Banco do Brasil e
      lançamento interno, com a política (LPG, PNAB, LAB) derivada do código
      do programa; na Ancine, só FSA e o fomento federal ao audiovisual
      (fora ART25/ART18, que já entram pelo SALIC); na Rouanet e na Ancine,
      só valor positivo.

      Janelas de observação, muito assimétricas: ROUANET 1993+, AUDIOVISUAL
      2005+, FSA 2011+, LAB/LPG/PNAB 2023+. Por isso a coluna
      ano_inicio_observacao, que a gold anual usa para marcar os anos
      censurados à esquerda.

      O piso de valor (var limiar_valor_fomento, padrão 375) é aplicado sobre
      o TOTAL do agente naquele mecanismo, não por transação, e só ao BB Ágil
      — é lá que existe resíduo de transação que não é repasse de fomento.
    config:
      tags: [gold, agentes, meta5, primeiro_acesso]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — espinha de eventos de acesso a fomento federal'
        origem_dados: 'int_ancine_bbagil_salic'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
          tags:
            - Certification.Gold
          glossary:
            - MinC.Agentes.AgenteCultural
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: beneficiario_documento
        description: CPF (11) ou CNPJ (14) do agente, normalizado com LPAD.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: programa_fomento
        description: >
          Mecanismo — 'AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB' ou 'ROUANET'.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
              - MinC.Politicas.Rouanet
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB', 'ROUANET']
      - name: data_evento
        description: Data em que o recurso chegou ao agente.
        data_type: date
        tests:
          - not_null
      - name: ano_evento
        description: Ano civil de data_evento.
        data_type: integer
        tests:
          - not_null
      - name: valor
        description: Valor do evento, em reais.
        data_type: numeric
        tests:
          - not_null
      - name: fonte
        description: "'BB_AGIL', 'SALIC' ou 'ANCINE'."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ANCINE', 'BB_AGIL', 'SALIC']
      - name: ano_inicio_observacao
        description: >
          Primeiro ano em que a fonte daquele mecanismo enxerga qualquer
          coisa: 1993 ROUANET, 2005 AUDIOVISUAL, 2011 FSA, 2023 LAB/LPG/PNAB.
          A gold usa este valor para marcar o ano censurado, em que todo mundo
          parece estreante porque não existe passado observável.
        data_type: integer
        tests:
          - not_null
      - name: tipo_pessoa
        description: "'PF' (11 dígitos) ou 'PJ' (14)."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PF', 'PJ']

  - name: eixo2_meta5_primeiro_acesso_agente
    description: >
      Camada Gold — Meta 5. Grão fino do indicador de novos entrantes: uma
      linha por (agente × mecanismo), com a data em que ele entrou naquele
      mecanismo e se aquela entrada foi a porta de entrada dele no fomento
      federal como um todo. Substitui primeiro_pagamento_bancario, que
      comparava datas apenas entre LPG e PNAB — num universo de dois
      programas, "não é novo entrante" só conseguia significar "recebeu o
      outro programa antes", e quem aparecia num programa só era sempre
      classificado como novo. Aqui a comparação é cross-mecanismo de
      verdade, e inclui a Rouanet desde 1993.

      Exatamente uma linha por agente tem eh_porta_de_entrada = true;
      empates de data no mesmo dia são desempatados por ordem de mecanismo
      (ROUANET, AUDIOVISUAL, FSA, LAB, LPG, PNAB) para que ninguém conte duas
      vezes.

      É Gold, e não Intermediate, porque não cruza base: aplica a definição
      de novo entrante. Lê eixo2_meta5_evento_fomento, Gold do mesmo produto.
    config:
      tags: [gold, agentes, meta5, primeiro_acesso]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — Primeiro Acesso ao Fomento Federal (por agente)'
        origem_dados: 'eixo2_meta5_evento_fomento'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier1
          owner: minc-data-engineering
          tags:
            - Certification.Gold
          glossary:
            - MinC.Agentes.AgenteCultural
            - MinC.Agentes.PrimeiroAcesso
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: beneficiario_documento
        description: >
          CPF (11) ou CNPJ (14) do agente, normalizado com LPAD. Chave de
          ligação com a lista de contemplados e com as demais fontes de
          evento. NÃO é pseudonimizado — sai em claro, como toda coluna de
          documento neste domínio hoje.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: programa_fomento
        description: >
          Mecanismo de fomento — 'AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB'
          ou 'ROUANET'.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
              - MinC.Politicas.Rouanet
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB', 'ROUANET']
      - name: tipo_pessoa
        description: "'PF' quando o documento tem 11 dígitos, 'PJ' quando tem 14."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PF', 'PJ']
      - name: data_primeiro_acesso_mecanismo
        description: Primeiro evento observado do agente neste mecanismo.
        data_type: date
        tests:
          - not_null
      - name: data_ultimo_acesso_mecanismo
        description: >
          Último evento observado do agente neste mecanismo. Não entra no
          indicador de primeiro acesso; serve para medir por quanto tempo o
          agente permaneceu naquele mecanismo.
        data_type: date
        tests:
          - not_null
      - name: ano_entrada_mecanismo
        description: >
          Ano de data_primeiro_acesso_mecanismo. É o ano de entrada NESTE
          mecanismo — não confundir com ano_primeiro_acesso_geral, que é o ano
          de entrada no fomento federal. Os dois coincidem só na linha em que
          eh_porta_de_entrada é verdadeiro.
        data_type: integer
        tests:
          - not_null
      - name: data_primeiro_acesso_geral
        description: >
          Primeiro evento do agente em QUALQUER mecanismo. É a data que
          define se ele é novo entrante.
        data_type: date
        tests:
          - not_null
      - name: ano_primeiro_acesso_geral
        description: Ano de data_primeiro_acesso_geral.
        data_type: integer
        tests:
          - not_null
      - name: qtd_mecanismos_agente
        description: Em quantos mecanismos distintos o agente já recebeu recurso.
        data_type: bigint
        tests:
          - not_null
      - name: qtd_eventos
        description: >
          Quantos eventos de fomento o agente teve neste mecanismo. Um
          pagamento parcelado conta várias vezes — é contagem de lançamento,
          não de projeto nem de contrato.
        data_type: bigint
        tests:
          - not_null
      - name: valor_total
        description: >
          Soma dos valores dos eventos do agente neste mecanismo, em reais.
          Já reflete o piso de eixo2_meta5_evento_fomento (var limiar_valor_fomento),
          que descarta o agente inteiro do mecanismo quando o total fica
          abaixo dele — nenhuma linha aqui tem total abaixo do piso no BB Ágil.
        data_type: numeric
        tests:
          - not_null
      - name: eh_porta_de_entrada
        description: >
          Verdadeiro no mecanismo pelo qual o agente entrou no fomento
          federal. Exatamente uma linha por agente.
        data_type: boolean
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
        tests:
          - not_null
      - name: categoria_primeiro_acesso
        description: "'Sim' quando esta linha é a porta de entrada do agente; 'Não' caso contrário."
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Sim', 'Não']
      - name: entrada_em_ano_censurado
        description: >
          Verdadeiro quando a entrada caiu no primeiro ano observável daquele
          mecanismo (2023 para LAB/LPG/PNAB). Descritivo: para a LAB isso é
          corte de janela, para LPG e PNAB é o ano de nascimento do programa —
          ver ano_censurado em eixo2_meta5_primeiro_acesso_anual, que separa os dois.
        data_type: boolean
        tests:
          - not_null

  - name: eixo2_meta5_primeiro_acesso_anual
    description: >
      Camada Gold — Meta 5. A série que responde às perguntas 1, 2.1 e 2.2:
      percentual anual de agentes de primeiro acesso, no total
      (programa_fomento = 'TODOS') e por mecanismo (AUDIOVISUAL, FSA, LAB,
      LPG, PNAB, ROUANET). Grão: 1 linha por (ano × mecanismo) mais o roll-up.

      A linha 'TODOS' não é a soma das linhas por mecanismo — um agente
      atendido por dois mecanismos no mesmo ano conta uma vez só nela.

      Os percentuais são TETO, não estimativa pontual: falta o FSA por
      planilha da Ancine (fora do banco) e a Lei Aldir Blanc I emergencial
      de 2020-2021 (não existe em nenhuma fonte do banco). Fonte ausente
      só transforma veterano em falso novo entrante, nunca o contrário,
      então o valor real é menor ou igual ao publicado.
    config:
      tags: [gold, agentes, meta5, primeiro_acesso, serie_anual]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — Percentual anual de proponentes de primeiro acesso'
        origem_dados: 'eixo2_meta5_evento_fomento + eixo2_meta5_primeiro_acesso_agente'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier1
          owner: minc-data-engineering
          tags:
            - Certification.Gold
          glossary:
            - MinC.Agentes.PrimeiroAcesso
            - MinC.Agentes.AgenteCultural
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: ano
        description: Ano civil do evento de recebimento de recurso.
        data_type: integer
        tests:
          - not_null
      - name: programa_fomento
        description: Mecanismo, ou 'TODOS' para o roll-up de todos os mecanismos.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
              - MinC.Politicas.Rouanet
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB', 'ROUANET', 'TODOS']
      - name: agentes_atendidos
        description: Agentes distintos que receberam recurso do mecanismo naquele ano (denominador).
        data_type: bigint
        tests:
          - not_null
      - name: novos_entrantes
        description: >
          Destes, quantos tiveram ali o primeiro acesso a qualquer fomento
          federal observável (numerador).
        data_type: bigint
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
        tests:
          - not_null
      - name: ja_contemplados_antes
        description: agentes_atendidos - novos_entrantes.
        data_type: bigint
        tests:
          - not_null
      - name: percentual_primeiro_acesso
        description: novos_entrantes / agentes_atendidos, em %.
        data_type: numeric
        tests:
          - not_null
      - name: ano_censurado
        description: >
          Verdadeiro quando a JANELA DE EXTRAÇÃO cortou passado que existe na
          origem: Rouanet em 1993 (a lei é de 1991) e o primeiro ano de cada
          trilha da Ancine, cujo piso duro em 2005-01-03 tem cara de extrato
          cortado e não de início de política. NÃO marca o primeiro ano de um
          programa novo: LPG e PNAB nasceram em 2023, nenhuma das 22.371
          contas deles é anterior, e a comparação contra a Rouanet rodou. A
          LAB também não é censurada — o que ficou de fora dela é a Aldir
          Blanc emergencial, que saiu do escopo por decisão de negócio.
        data_type: boolean
        tests:
          - not_null
      - name: ano_parcial
        description: >
          Verdadeiro no último ano com dado, que ainda não terminou. O
          percentual de um ano parcial vem deprimido — menos gente nova
          acumulada — e não deve ser comparado com anos fechados.
        data_type: boolean
        tests:
          - not_null

  - name: eixo2_meta5_trajetoria_fomento_direto_rouanet
    description: >
      Camada Gold — Meta 5, pergunta 2.3: há novos entrantes pelo fomento
      direto (LAB/LPG/PNAB) que depois acessaram a Lei Rouanet? Grão: 1
      linha por (trajetória × tipo de pessoa × mecanismo de porta de entrada).

      Mede as duas direções. DIRETO_DEPOIS_ROUANET responde a pergunta 2.3
      literalmente. ROUANET_ANTES_DIRETO é a direção oposta e vale como
      controle do indicador inteiro: são agentes que já acessavam recurso
      público federal antes de 2023 e que, sem a fonte do SALIC, seriam
      contados como novos entrantes do fomento direto.
    config:
      tags: [gold, agentes, meta5, primeiro_acesso, rouanet]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — Trajetória entre fomento direto e Rouanet'
        origem_dados: 'eixo2_meta5_primeiro_acesso_agente'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier1
          owner: minc-data-engineering
          tags:
            - Certification.Gold
          glossary:
            - MinC.Agentes.PrimeiroAcesso
            - MinC.Politicas.Rouanet
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: trajetoria
        description: >
          'SO_DIRETO', 'SO_ROUANET', 'DIRETO_DEPOIS_ROUANET',
          'ROUANET_ANTES_DIRETO', 'MESMO_DIA' ou 'SO_AUDIOVISUAL' (so na trilha da Ancine,
          fora da pergunta 2.3).
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SO_DIRETO', 'SO_ROUANET', 'SO_AUDIOVISUAL', 'DIRETO_DEPOIS_ROUANET', 'ROUANET_ANTES_DIRETO', 'MESMO_DIA']
      - name: tipo_pessoa
        description: "'PF' ou 'PJ'."
        data_type: text
        tests:
          - not_null
      - name: mecanismo_porta_entrada
        description: >
          Mecanismo pelo qual o agente entrou no fomento federal. Necessário
          para separar percurso de novidade: DIRETO_DEPOIS_ROUANET com porta
          em AUDIOVISUAL ou FSA é agente que já acessava recurso federal antes
          de 2023, e portanto não responde à 2.3. É NULL só para o balde
          SO_AUDIOVISUAL quando o agente não tem porta única identificada.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
      - name: agentes
        description: Quantidade de agentes distintos naquela trajetória.
        data_type: bigint
        tests:
          - not_null
      - name: primeira_entrada_direto
        description: >
          Data de entrada no fomento direto (LAB/LPG/PNAB) do agente mais
          antigo do grupo. NULL nos baldes que não têm fomento direto
          (SO_ROUANET, SO_AUDIOVISUAL). Serve para situar o grupo no tempo,
          não para comparar taxas — para isso use
          eixo2_meta5_conversao_direto_rouanet_coorte, que controla tempo de exposição.
        data_type: date
      - name: ultima_entrada_direto
        description: >
          Data de entrada no fomento direto do agente mais recente do grupo.
          Junto com primeira_entrada_direto delimita a janela em que o grupo
          se formou. NULL nos mesmos baldes.
        data_type: date
      - name: primeira_entrada_rouanet
        description: >
          Data de captação na Rouanet do agente mais antigo do grupo. NULL nos
          baldes sem Rouanet (SO_DIRETO, SO_AUDIOVISUAL).
        data_type: date
      - name: ultima_entrada_rouanet
        description: >
          Data de captação na Rouanet do agente mais recente do grupo. NULL nos
          mesmos baldes.
        data_type: date
      - name: media_dias_entre_mecanismos
        description: >
          Média, em dias, da distância ABSOLUTA entre a entrada no fomento
          direto e a captação na Rouanet, com uma casa decimal. Por ser em
          módulo, não distingue direção — mede quanto tempo separa os dois
          acessos, não qual veio primeiro; a direção está em trajetoria. Só
          considera agentes com as duas datas, então é NULL em SO_DIRETO,
          SO_ROUANET e SO_AUDIOVISUAL, e 0 em MESMO_DIA.
        data_type: numeric

  - name: eixo2_meta5_conversao_direto_rouanet_coorte
    description: >
      Camada Gold — Meta 5, pergunta 2.3 com tempo de exposição controlado:
      dos agentes que ENTRARAM no fomento federal pelo fomento direto
      (LAB/LPG/PNAB), quantos depois captaram na Lei Rouanet? Grão: 1 linha
      por (coorte de entrada × porta de entrada × tipo de pessoa).

      Existe separada de eixo2_meta5_trajetoria_fomento_direto_rouanet porque a contagem
      bruta é enganosa: o fomento direto nasceu em 2023, então cada coorte
      teve uma janela diferente para converter. converteram_ate_12m dá a
      todas a mesma janela; coorte_com_12m_completos marca quais coortes já
      a cumpriram por inteiro — nas que não cumpriram, a taxa é piso.

      Denominador é porta de entrada, não passagem: quem já aparecia na
      trilha da Ancine antes de 2023 não é novo entrante e fica fora.
      Numerador é captação real na Rouanet, não projeto protocolado nem
      aprovado.
    config:
      tags: [gold, agentes, meta5, primeiro_acesso, rouanet]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — Conversão do fomento direto para a Rouanet, por coorte'
        origem_dados: 'eixo2_meta5_primeiro_acesso_agente'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier1
          owner: minc-data-engineering
          tags:
            - Certification.Gold
          glossary:
            - MinC.Agentes.PrimeiroAcesso
            - MinC.Politicas.Rouanet
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: coorte_entrada
        description: Ano em que o agente entrou no fomento federal pela primeira vez.
        data_type: integer
        tests:
          - not_null
      - name: porta_de_entrada
        description: "Mecanismo de entrada: 'LAB', 'LPG' ou 'PNAB'."
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LAB', 'LPG', 'PNAB']
      - name: tipo_pessoa
        description: "'PF' ou 'PJ'."
        data_type: text
        tests:
          - not_null
      - name: entrantes
        description: Agentes distintos que entraram por aquela porta naquela coorte.
        data_type: bigint
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
        tests:
          - not_null
      - name: converteram_rouanet
        description: >
          Quantos deles captaram na Rouanet em data posterior à entrada.
          Nunca maior que entrantes.
        data_type: bigint
        tests:
          - not_null
      - name: converteram_ate_12m
        description: >
          Subconjunto de converteram_rouanet que captou em até 365 dias.
          Métrica comparável entre coortes.
        data_type: bigint
        tests:
          - not_null
      - name: pct_converteram
        description: >
          converteram_rouanet / entrantes, em %, com três casas. NÃO é
          comparável entre coortes: a coorte de 2023 teve mais tempo para
          converter que a de 2025. Para comparar, use
          pct_converteram_ate_12m.
        data_type: numeric
        tests:
          - not_null
      - name: pct_converteram_ate_12m
        description: >
          converteram_ate_12m / entrantes, em %, com três casas. É a taxa
          comparável entre coortes, porque dá a todas a mesma janela de 365
          dias. Nas coortes com coorte_com_12m_completos falso ela ainda é
          piso — parte dos agentes não teve os 12 meses inteiros.
        data_type: numeric
        tests:
          - not_null
      - name: mediana_dias_ate_rouanet
        description: >
          Mediana de dias entre a entrada no fomento direto e a captação na
          Rouanet, considerando só quem converteu. PERCENTILE_DISC, então é um
          valor que existe nos dados, não uma interpolação. NULL quando
          ninguém do grupo converteu.
        data_type: integer
      - name: coorte_com_12m_completos
        description: >
          Verdadeiro quando o agente de entrada MAIS RECENTE da coorte já
          completou 365 dias de exposição. Onde é falso, converteram_ate_12m e
          pct_converteram_ate_12m são piso, não taxa final — parte da coorte
          ainda está dentro da janela de conversão.
        data_type: boolean
        tests:
          - not_null

  - name: eixo2_meta5_primeiro_acesso_contemplados
    description: >
      Camada Gold — Meta 5. O mesmo indicador de novos entrantes, restrito a
      quem aparece nas listas oficiais de contemplados dos editais (LPG e
      PNAB), em vez de a todo agente visto recebendo dinheiro. Grão: 1 linha
      por (programa × categoria de primeiro acesso).

      A classificação vem de eixo2_meta5_primeiro_acesso_agente, então já é
      cross-mecanismo e já considera a Rouanet desde 1993.

      Cobertura parcial e medida: a interseção entre lista de contemplados e
      extrato bancário fica em torno de 46% na LPG e 89% no PNAB. A causa
      não é atraso de pagamento nem filtro agressivo — o BB Ágil só enxerga
      contas administradas pelo Banco do Brasil, e o município frequentemente
      declara ter pago um contemplado cujo pagamento não passou por lá.
      Contemplado sem evento observável fica de fora, sem fallback
      autodeclarado.
    config:
      tags: [gold, agentes, bbagil, meta5, contemplados, primeiro_acesso]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — Novos Entrantes entre contemplados de edital'
        origem_dados: 'eixo2_meta5_primeiro_acesso_agente + int_ancine_bbagil_salic_transferegov'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier1
          owner: minc-data-engineering
          tags:
            - Certification.Gold
          glossary:
            - MinC.Agentes.Contemplado
            - MinC.Agentes.PrimeiroAcesso
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: programa_fomento
        description: Programa de fomento — 'LPG' ou 'PNAB'.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LPG', 'PNAB']
      - name: categoria_primeiro_acesso
        description: >
          'Sim' — foi por este mecanismo que o agente entrou no fomento
          federal (novo entrante); 'Não' — já havia recebido recurso antes,
          em qualquer mecanismo observável.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Sim', 'Não']
      - name: total_proponentes
        description: Contagem distinta de contemplados com evento observável, por categoria.
        data_type: bigint
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.Contemplado
        tests:
          - not_null
      - name: percentual
        description: >
          Percentual da categoria sobre o total de contemplados com evento
          observável no mesmo programa_fomento (cada programa soma 100%).
        data_type: numeric
        tests:
          - not_null
