  - name: agentes__agentes
    description: >
      Uma linha por agente cultural — proponente, incentivador ou fornecedor —
      identificado por idagente e por cnpjcpf. ~998 mil linhas. Camada bronze
      tipada a partir de salic_bronze.agentes__agentes. É a raiz do domínio
      Agentes: agentes__tbagentefisico, agentes__perfil e agentes__endereconacional
      referenciam idagente.
      Armadilha: `tipopessoa` é um bit da origem (True/False) e a semântica
      física/jurídica NÃO foi confirmada; `cnpjcpfsuperior` chega constante zero.
    columns:
      - name: idagente
        description: Identificador do agente. Chave da tabela.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
          - unique   # inferido do perfil do banco
      - name: cnpjcpf
        description: >
          CNPJ (14) ou CPF (11) do agente, sem máscara. Dado pessoal; mantido text
          para preservar o zero à esquerda.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: cnpjcpfsuperior
        description: >
          CNPJ/CPF da entidade superior. Medido constante '00000000000000' na
          amostra (sem entidade superior).
        data_type: text
      - name: tipopessoa
        description: >
          Bit da origem (True/False). [NÃO VERIFICADO] a correspondência com
          pessoa física/jurídica; não assumir sem checar.
        data_type: boolean
        tests:
          - not_null   # inferido do perfil do banco
      - name: dtcadastro
        description: Data/hora de cadastro do agente.
        data_type: timestamp
      - name: dtatualizacao
        description: Data/hora da última atualização do cadastro.
        data_type: timestamp
      - name: dtvalidade
        description: Data/hora de validade do cadastro.
        data_type: timestamp
      - name: status
        description: Flag de status do agente (bit 0/1).
        data_type: boolean
        tests:
          - not_null   # inferido do perfil do banco
      - name: usuario
        description: Identificador/flag do usuário (valores 0/1 na amostra).
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe a
          linha (ADR 0005). Não é campo de negócio.
        data_type: integer

  - name: agentes__tbagentefisico
    description: >
      Uma linha por agente pessoa física, com atributos pessoais. ~137 mil linhas.
      Camada bronze tipada a partir de salic_bronze.agentes__tbagentefisico. Liga
      a agentes__agentes por idagente.
      DADO SENSÍVEL: nome dos pais, cor/raça (stcorraca) e necessidade especial
      (stnecessidadeespecial). Uso exige base legal; não expor em painel aberto.
    columns:
      - name: idagente
        description: Agente pessoa física. Chave, aponta para agentes__agentes.idagente.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
          - unique   # inferido do perfil do banco
      - name: stsexo
        description: Sexo declarado (M/F).
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: stestadocivil
        description: Estado civil, código de 2 letras (SJ, DI, CA, ...).
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: stnecessidadeespecial
        description: >
          Necessidade especial (N/S). Dado sensível de deficiência. Medido
          majoritariamente 'N' na amostra.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: nmmae
        description: >
          Nome da mãe. Dado pessoal. Origem char(100) com espaços à direita — o
          cast (bronze_texto) já apara e transforma vazio em NULL.
        data_type: text
      - name: nmpai
        description: >
          Nome do pai. Dado pessoal. Origem char(100) com espaços à direita.
        data_type: text
      - name: dtnascimento
        description: Data de nascimento. Dado pessoal.
        data_type: timestamp
      - name: stcorraca
        description: >
          Código de cor/raça autodeclarada. Dado sensível. Preenchida em apenas
          ~2,5% das linhas — a ausência é a regra, não a exceção.
        data_type: integer
      - name: nridentificadorprocessual
        description: '[VAZIA EM 100% DAS LINHAS]'
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe a
          linha (ADR 0005). Não é campo de negócio.
        data_type: integer

