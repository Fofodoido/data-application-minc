              Server): int(4).
            data_type: text
          - name: idprojeto
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int(4).
            data_type: text
          - name: sitransferenciarecurso
            description: >
              Recurso Bloqueado; 1.Recurso Liberado Tipo original (SQL Server): char(1).
            data_type: text
          - name: dttransferenciarecurso
            description: >
