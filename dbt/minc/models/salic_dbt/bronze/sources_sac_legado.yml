version: 2
sources:
  # Schema `bronze` — saída da ingestão SALIC v1, LEGADA. Mantido só pelas
  # tabelas que `salic/silver_legado_sac_captacao_proponente` ainda consome e
  # que não têm equivalente no `salic_bronze` da ingestão v2 (ADR 0005).
  # Não declare tabela nova aqui: a bronze nova é `bronze_sac`, em salic_bronze.
  - name: bronze_sac_legado
    schema: bronze
    description: >
      Núcleo do SALIC na ingestão v1 (schema `bronze`), preservado apenas para as
      tabelas ainda consumidas por modelos existentes. A ingestão oficial é a v2,
      no schema `salic_bronze`.
    tables:
      - name: sac__captacao
        description: >
          Tabela responsável por registrar as captações de recursos dos projetos, incluindo
          recibos, datas, valores captados, tipo de apoio e informações do mecenas.
        config:
          tags:
            - bronze
            - salic
            - sac
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: idcaptacao
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int identity(4).
            data_type: text
            tests:
              - not_null
          - name: anoprojeto
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): char(2).
            data_type: text
          - name: sequencial
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): varchar(5).
            data_type: text
          - name: numerorecibo
            description: >
