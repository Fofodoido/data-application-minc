              Server): char(1).
            data_type: text
      - name: sac__projetos
        description: >
          Tabela responsável por armazenar as informações cadastrais e de acompanhamento dos
          projetos, incluindo PRONAC, área, segmento, situação, valores solicitados e períodos
          de execução.
        config:
          tags:
            - bronze
            - salic
            - sac
        meta:
