version: 2
sources:
  # Schema `bronze` — saída da ingestão SALIC v1, LEGADA. Desde 21/10/2026
  # nenhum modelo lê daqui: a silver da Rouanet passou para a v2. A declaração
  # fica até a ingestão v1 ser desligada; não declare tabela nova aqui, a bronze
  # nova é `bronze_sac`, em salic_bronze.
  - name: bronze_sac_legado
    schema: bronze
    description: >
      Núcleo do SALIC na ingestão v1 (schema `bronze`), preservado apenas para as
      tabelas ainda consumidas por modelos existentes. A ingestão oficial é a v2,
      no schema `salic_bronze`.
    tables:
      - name: sac__captacao
        description: >
          Tabela responsável por registrar as captações de recursos dos projetos, incluindo
          recibos, datas, valores captados, tipo de apoio e informações do mecenas.
        config:
          tags:
            - bronze
            - salic
            - sac
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: idcaptacao
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int identity(4).
            data_type: text
            tests:
              - not_null
          - name: anoprojeto
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): char(2).
            data_type: text
          - name: sequencial
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): varchar(5).
            data_type: text
          - name: numerorecibo
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): varchar(5).
            data_type: text
          - name: cgccpfmecena
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): varchar(14).
            data_type: text
            meta:
              openmetadata:
                tags:
                  - PII.Sensitive
          - name: tipoapoio
            description: "patrocinio ou doação 1\tDoação2\tPatrocínio Tipo original (SQL Server): char(1).\n"
            data_type: text
          - name: medidaprovisoria
            description: >
              1 - artigo 26 (lei 8.313/91) e 2 - artigo 18MedidaProvisoria : 1.Artigo 26 e  2.100%
              Tipo original (SQL Server): char(1).
            data_type: text
          - name: dtchegadarecibo
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): datetime(16,3).
            data_type: text
          - name: dtrecibo
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): datetime(16,3).
            data_type: text
          - name: captacaoreal
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): money(21,4).
            data_type: text
          - name: captacaoufir
            description: >
