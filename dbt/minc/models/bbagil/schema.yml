version: 2

# BB Ágil, na estrutura do ADR 0010: bronze_<tabela> é a cópia fiel do que a
# extracao_bbagil_dag grava em bbagil.<tabela>; silver_<tabela> tipa. Os
# silver_pagamento_* (Meta 5) leem a silver tipada (silver_extrato_bbagil e
# silver_subtransacao_bbagil) e só limpam: o que é pagamento efetivo (estorno,
# só débito, status 'Pago') e quem conta como agente cultural é regra de
# negócio e mora na Gold eixo2_meta5_evento_fomento.
models:
  - name: bronze_controle_extracao_bbagil_extrato
    description: >
      Camada Bronze — cópia fiel de bbagil.controle_extracao_bbagil_extrato, sem cast, filtro nem join
      (ADR 0010). Todas as colunas chegam como na origem.
    config:
      tags:
        - bronze
        - bbagil
    meta:
      openmetadata:
        domain: Cultura.Repasse Federativo
        tier: Tier.Tier4
        owner: minc-data-engineering

