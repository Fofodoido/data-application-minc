  - name: silver_pagamento_extrato_bbagil
    description: >
      Camada Silver — extrato bancário do BB Gestão Ágil (schema `bbagil`),
      filtrado pelos 8 filtros de negócio (documento válido, sem
      subtransação, exclui BB/FNC/estornos/repasses entre entes públicos).
      Só débitos (pagamentos de fato) sobrevivem. Fonte primária da Meta 5
      Fase 4 (primeiro acesso comprovado por dado bancário).

      Grão: 1 linha por transação de débito do extrato — a chave da origem é
      (id_plano_acao, id). Transações com subtransactionquantity > 0 ficam
      fora de propósito: nelas o beneficiário real só aparece no
      sublançamento, e quem os traz é silver_pagamento_subtransacao_bbagil.

      O par débito/crédito de mesmo valor, mesmo documento e mesmo plano de
      ação é lido como estorno e removido dos dois lados — cobrar o débito
      sem descontar o crédito inventaria pagamento que foi desfeito.
    config:
      tags: [silver, agentes, bbagil, meta5, fase4]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — pagamentos do BB Ágil sem subtransação'
        origem_dados: 'bbagil.extrato_bbagil'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier3
          owner: minc-data-engineering
          tags:
            - Certification.Bronze
          glossary:
            - MinC.Politicas.FundoAFundo
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: id_plano_acao
        description: Identificador do plano de ação (ente + programa) dono das contas bancárias.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdPlanoAcao
        tests:
          - not_null
      - name: id_plano_acao_dado_bancario
        description: >
          Identificador da conta bancária no Transferegov. Um plano de ação
          tem mais de uma conta (os da LPG têm duas) e cada uma é consultada
          separadamente no BB Ágil — por isso a conta faz parte da chave da
          tabela raw, do join com as subtransações e da detecção de estorno.
        data_type: text
        tests:
          - not_null
      - name: id
        description: >
          Identificador da transação no extrato (id_plano_acao +
          id_plano_acao_dado_bancario + id é a chave da tabela raw). Usado por
          silver_pagamento_subtransacao_bbagil pra achar a transação-mãe
          (id_transacao_pai = id, dentro da mesma conta).
        data_type: text
        tests:
          - not_null
      - name: programa_curto
        description: >
          Código curto do programa devolvido pelo BSC (governmentprogramname —
          ex. 'MINC-LPG-MUNI-AUD', 'MINC-PNAB-2023'). Insumo pra derivar
          programa_fomento em silver_pagamento_bbagil.
        data_type: text
      - name: beneficiario_documento
        description: >
          CPF/CNPJ do beneficiário do pagamento, normalizado (LPAD por
          beneficiarypersontype — 11 dígitos p/ CPF, 14 p/ CNPJ).
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: beneficiario_nome
        description: >
          Nome do beneficiário do pagamento, como devolvido pelo BSC. Também
          é o campo em que os filtros de repasse entre entes públicos agem:
          nomes começados por MUNICIPIO, ESTADO, FUNDO, SECRETARIA ou SEFAZ
          não chegam aqui.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: valor
        description: Valor do pagamento (débito), em reais.
        data_type: numeric
        tests:
          - not_null
      - name: data_pagamento
        description: Data do lançamento no extrato (bookingdate), convertida pra DATE.
        data_type: date
        tests:
          - not_null

  - name: silver_pagamento_subtransacao_bbagil
    description: >
      Camada Silver — sublançamentos do BB Gestão Ágil, usados quando a
      transação-mãe do extrato tem subtransactionquantity > 0 (o
      beneficiário real só aparece aqui). Filtra por status 'Pago' e
      exclui repasses entre entes públicos.

      Grão: 1 linha por sublançamento pago. Complementa
      silver_pagamento_extrato_bbagil sem sobrepô-lo — um trata a transação que é
      pagamento direto, o outro a que é bolo repartido entre vários
      beneficiários. Os dois juntos formam silver_pagamento_bbagil.

      O valor vem em módulo (ABS): no sublançamento o sinal indica o lado da
      partida dobrada, não devolução.
    config:
      tags: [silver, agentes, bbagil, meta5, fase4]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — sublançamentos pagos do BB Ágil'
        origem_dados: 'bbagil.subtransacao_bbagil + bbagil.extrato_bbagil'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier3
          owner: minc-data-engineering
          tags:
            - Certification.Bronze
          glossary:
            - MinC.Politicas.FundoAFundo
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: id_plano_acao
        description: Identificador do plano de ação, herdado da transação-mãe.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdPlanoAcao
        tests:
          - not_null
      - name: id_plano_acao_dado_bancario
        description: >
          Identificador da conta bancária de onde saiu o sublançamento. Entra
          no join com a transação-mãe: o `id` da transação não é único entre
          as contas de um mesmo plano, então sem a conta o join duplicaria
          cada sublançamento.
        data_type: text
        tests:
          - not_null
      - name: programa_curto
        description: >
          Código curto do programa (governmentprogramname), herdado da
          transação-mãe do extrato via id_plano_acao +
          id_plano_acao_dado_bancario + id_transacao_pai = id.
        data_type: text
      - name: beneficiario_documento
        description: CPF/CNPJ do beneficiário do sublançamento, normalizado (LPAD por persontype).
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: beneficiario_nome
        description: >
          Nome do beneficiário do sublançamento, como devolvido pelo BSC.
          Mesmos filtros de ente público do extrato agem sobre este campo.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: valor
        description: Valor do sublançamento (em módulo), em reais.
        data_type: numeric
        tests:
          - not_null
      - name: data_pagamento
        description: Data de pagamento do sublançamento (paymentdate), convertida pra DATE.
        data_type: date
        tests:
          - not_null

  - name: silver_pagamento_bbagil
    description: >
      Camada Silver — Meta 5 Fase 4. Unifica silver_pagamento_extrato_bbagil e
      silver_pagamento_subtransacao_bbagil em 1 linha por pagamento real a um
      beneficiário, com programa_fomento (LPG/PNAB/LAB) derivado do código
      curto de programa do BSC. Alimenta int_bbagil_salic_ancine_eventos_fomento.

      LAB deixou de ser colapsado em PNAB: os códigos SECULT-A BLANC são a
      Lei Aldir Blanc II (Lei 14.399/2022), e a pergunta 2.2 da Meta 5 pede
      os mecanismos separados. A LAB I emergencial (2020-2021) não existe em
      nenhuma fonte do banco.

      Pagamento cujo programa_curto não casa com nenhum dos três padrões sai
      da tabela (programa_fomento NULL é filtrado). É movimentação de conta
      de plano de ação que não é repasse de política do MinC.
    config:
      tags: [silver, agentes, bbagil, meta5, fase4]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — pagamentos do BB Ágil por beneficiário e mecanismo'
        origem_dados: 'silver_pagamento_extrato_bbagil + silver_pagamento_subtransacao_bbagil'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
          tags:
            - Certification.Silver
          glossary:
            - MinC.Agentes.AgenteCultural
            - MinC.Politicas.FundoAFundo
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: id_plano_acao
        description: Identificador do plano de ação (ente + programa) dono da conta que fez o pagamento.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdPlanoAcao
        tests:
          - not_null
      - name: beneficiario_documento
        description: CPF/CNPJ do beneficiário do pagamento, normalizado.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: programa_fomento
        description: >
          Programa de fomento — 'LPG', 'PNAB' ou 'LAB'. Derivado do
          programa_curto do BSC: 'MINC-LPG%' vira LPG, '%PNAB%' vira PNAB e
          '%A-BLANC%' vira LAB (a comparação normaliza underscore e espaço
          para hífen antes de casar).
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LPG', 'PNAB', 'LAB']
      - name: valor
        description: Valor do pagamento, em reais.
        data_type: numeric
        tests:
          - not_null
      - name: data_pagamento
        description: Data do pagamento.
        data_type: date
        tests:
          - not_null
