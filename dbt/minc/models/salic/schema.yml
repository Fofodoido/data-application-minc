version: 2

# SALIC fora do salic_dbt, na estrutura do ADR 0010. Por enquanto só a trilha
# da Meta 5, que lê a ingestão v2 (salic_bronze, source bronze_sac).
#
# Os nomes seguem a entidade <banco>_<tabela> do ADR. Quando o salic_dbt
# migrar, os modelos sac__<tabela> de lá (que tipam) viram silver_sac_<tabela>
# aqui e reaproveitam estas bronzes.
models:
  - name: bronze_sac_captacao
    description: >
      Camada Bronze — cópia fiel de salic_bronze.sac__captacao (ingestão SALIC
      v2, via Trino), sem cast, filtro nem join (ADR 0010). Todas as colunas
      chegam como text, como na origem.
    config:
      tags:
        - bronze
        - salic
    meta:
      openmetadata:
        domain: Cultura.Incentivo Fiscal
        tier: Tier.Tier4
        owner: minc-data-engineering

  - name: bronze_sac_projetos
    description: >
      Camada Bronze — cópia fiel de salic_bronze.sac__projetos (ingestão SALIC
      v2, via Trino), sem cast, filtro nem join (ADR 0010). Todas as colunas
      chegam como text, como na origem.
    config:
      tags:
        - bronze
        - salic
    meta:
      openmetadata:
        domain: Cultura.Incentivo Fiscal
        tier: Tier.Tier4
        owner: minc-data-engineering

  - name: silver_sac_captacao_proponente
    description: >
      Camada Silver — Meta 5. Um evento por captação real de recurso na Lei
      Rouanet, no mesmo formato dos pagamentos do BB Ágil. O evento é o
      recibo de captação (dinheiro efetivamente captado), não a aprovação do
      projeto: projeto aprovado que nunca captou não deu acesso a recurso
      nenhum, e misturar aprovação com pagamento tornaria a comparação entre
      mecanismos incoerente. Grão: 1 linha por recibo de captação.

      O proponente de cada PRONAC vem de sac__projetos (cgccpf), o cadastro
      oficial do projeto. A chave é anoprojeto || sequencial nas duas tabelas.

      O PRONAC NÃO leva LPAD: é ano de 2 dígitos seguido de sequencial de
      largura variável, e preencher com zero à esquerda quebra o casamento
      com sac__captacao.

      Lê a ingestão v2 do SALIC (salic_bronze, via bronze_sac_captacao e
      bronze_sac_projetos). Até 21/10/2026 lia a v1 (schema `bronze`) e usava
      sac__tbapiprojetorouanet como reserva de proponente; a v2 não ingere
      essa tabela, e o cadastro sozinho cobria 100% dos recibos válidos em
      19/08/2026. Recibo cujo PRONAC o cadastro não resolve fica de fora.
    config:
      tags: [silver, agentes, salic, rouanet, meta5]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — eventos de captação da Lei Rouanet'
        origem_dados: 'bronze_sac.sac__captacao + sac__projetos (salic_bronze, v2)'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
          tags:
            - Certification.Silver
          glossary:
            - MinC.Politicas.Rouanet
            - MinC.Agentes.Proponente
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: beneficiario_documento
        description: CPF (11) ou CNPJ (14) do proponente, normalizado com LPAD.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: beneficiario_nome
        description: >
          Nome do proponente. Sempre NULL desde a troca para a v2: o cadastro
          (sac__projetos) não traz o nome, e quem trazia era a reserva
          sac__tbapiprojetorouanet, que saiu. Fica pelo contrato do modelo e
          não atravessa para int_bbagil_salic_ancine_eventos_fomento.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: programa_fomento
        description: Sempre 'ROUANET'.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.Rouanet
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ROUANET']
      - name: data_evento
        description: Data do recibo de captação.
        data_type: date
        tests:
          - not_null
      - name: valor
        description: Valor captado no recibo, em reais. Sempre maior que zero.
        data_type: numeric
        tests:
          - not_null
      - name: pronac
        description: >
          PRONAC do projeto que captou — anoprojeto (2 dígitos) concatenado
          ao sequencial, sem preenchimento. Chave de ligação entre o recibo e
          o proponente.
        data_type: text
        tests:
          - not_null
