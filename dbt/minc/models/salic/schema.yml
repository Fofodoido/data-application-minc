version: 2

# SALIC fora do salic_dbt, na estrutura do ADR 0010. Por enquanto só a trilha
# da Meta 5, que ainda lê a ingestão v1 (schema `bronze`, source
# bronze_sac_legado).
#
# EXCEÇÃO DE ENTIDADE: o `legado_` no nome. Pelo ADR a entidade do SALIC é
# <banco>_<tabela> (bronze_sac_captacao), mas esse nome é da bronze da v2,
# quando o salic_dbt migrar. Estes modelos saem quando a reconciliação G3 entre
# v1 e v2 for feita (HANDOFF.md).
models:
  - name: bronze_legado_sac_captacao
    description: >
      Camada Bronze — cópia fiel de bronze.sac__captacao (ingestão SALIC v1), sem cast, filtro nem join
      (ADR 0010). Todas as colunas chegam como na origem.
    config:
      tags:
        - bronze
        - salic
    meta:
      openmetadata:
        domain: Cultura.Incentivo Fiscal
        tier: Tier.Tier4
        owner: minc-data-engineering

  - name: bronze_legado_sac_projetos
    description: >
      Camada Bronze — cópia fiel de bronze.sac__projetos (ingestão SALIC v1), sem cast, filtro nem join
      (ADR 0010). Todas as colunas chegam como na origem.
    config:
      tags:
        - bronze
        - salic
    meta:
      openmetadata:
        domain: Cultura.Incentivo Fiscal
        tier: Tier.Tier4
        owner: minc-data-engineering

  - name: bronze_legado_sac_tbapiprojetorouanet
    description: >
      Camada Bronze — cópia fiel de bronze.sac__tbapiprojetorouanet (ingestão SALIC v1), sem cast, filtro nem join
      (ADR 0010). Todas as colunas chegam como na origem.
    config:
      tags:
        - bronze
        - salic
    meta:
      openmetadata:
        domain: Cultura.Incentivo Fiscal
        tier: Tier.Tier4
        owner: minc-data-engineering

  - name: silver_legado_sac_captacao_proponente
    description: >
      Camada Silver — Meta 5. Um evento por captação real de recurso na Lei
      Rouanet, no mesmo formato dos pagamentos do BB Ágil. O evento é o
      recibo de captação (dinheiro efetivamente captado), não a aprovação do
      projeto: projeto aprovado que nunca captou não deu acesso a recurso
      nenhum, e misturar aprovação com pagamento tornaria a comparação entre
      mecanismos incoerente. Grão: 1 linha por recibo de captação.

      O proponente de cada PRONAC é resolvido por prioridade, com DISTINCT ON:
      sac__projetos vem primeiro (é a ponte natural, com cgccpf), e
      sac__tbapiprojetorouanet entra como segunda opção, pelo nrpronac. As
      duas chegam à mesma chave — anoprojeto || sequencial = nrpronac.

      O PRONAC NÃO leva LPAD: é ano de 2 dígitos seguido de sequencial de
      largura variável, e preencher com zero à esquerda quebra o casamento
      com sac__captacao.

      Lê a ingestão v1 do SALIC (source `bronze_sac_legado`, schema `bronze`),
      não a v2 oficial em `salic_bronze`. Migrar é trabalho à parte: a v2 tem
      571 modelos de bronze e ainda não foi verificado se a captação chega lá
      com o mesmo grão e a mesma cobertura de 1993 em diante.
    config:
      tags: [silver, agentes, salic, rouanet, meta5]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — eventos de captação da Lei Rouanet'
        origem_dados: 'bronze_sac_legado.sac__captacao + sac__projetos + sac__tbapiprojetorouanet'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
          tags:
            - Certification.Silver
          glossary:
            - MinC.Politicas.Rouanet
            - MinC.Agentes.Proponente
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: beneficiario_documento
        description: CPF (11) ou CNPJ (14) do proponente, normalizado com LPAD.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: beneficiario_nome
        description: >
          Nome do proponente. Só existe quando o casamento veio por
          sac__tbapiprojetorouanet — a prioridade 1 (sac__projetos) não traz
          nome e devolve NULL. Não atravessa para int_bbagil_salic_ancine_eventos_fomento.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: programa_fomento
        description: Sempre 'ROUANET'.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.Rouanet
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ROUANET']
      - name: data_evento
        description: Data do recibo de captação.
        data_type: date
        tests:
          - not_null
      - name: valor
        description: Valor captado no recibo, em reais. Sempre maior que zero.
        data_type: numeric
        tests:
          - not_null
      - name: pronac
        description: >
          PRONAC do projeto que captou — anoprojeto (2 dígitos) concatenado
          ao sequencial, sem preenchimento. Chave de ligação entre o recibo e
          o proponente.
        data_type: text
        tests:
          - not_null
