  - name: transferegov
    schema: transferegov
    tables:
      - name: programa_minc
        meta:
          openmetadata:
            domain: Cultura.Repasse Federativo
            tier: Tier.Tier4
            owner: minc-data-engineering
        columns:
          - name: sigla
            description: >
              Coluna sempre nula: nenhum dos 11 registros tem valor. Candidata a remoção ou a
              investigação da extração.
            data_type: text
          - name: dt_ingest
            description: >
              Identificador: 11 valores distintos em 11 registros, sem repetição. Comprimento
              fixo de 26 caracteres. Perfil obtido só com agregado; nenhum valor de exemplo é
              reproduzido aqui.
            data_type: text
            tests:
              - not_null   # inferido do perfil do banco
          - name: id_programa
            description: >
              Identificador: 11 valores distintos em 11 registros, sem repetição. Comprimento
              entre 1 e 3 caracteres. Perfil obtido só com agregado; nenhum valor de exemplo
              é reproduzido aqui.
            data_type: text
            tests:
              - not_null   # inferido do perfil do banco
              - unique   # inferido do perfil do banco
          - name: ano_programa
            description: >
              4 valores distintos em 11 registros preenchidos de 11. Comprimento fixo de 4
              caracteres. Domínio fechado, com 1 valores distintos acima do limite de
              supressão. Perfil obtido só com agregado; nenhum valor de exemplo é reproduzido
              aqui.
            data_type: text
            tests:
              - not_null   # inferido do perfil do banco
          - name: url_consulta
            description: >
              Identificador: 11 valores distintos em 11 registros, sem repetição. Comprimento
              entre 82 e 84 caracteres. Perfil obtido só com agregado; nenhum valor de
              exemplo é reproduzido aqui.
            data_type: text
            tests:
              - not_null   # inferido do perfil do banco
              - unique   # inferido do perfil do banco
          - name: nome_programa
            description: >
              Identificador: 11 valores distintos em 11 registros, sem repetição. Comprimento
              entre 17 e 54 caracteres. Perfil obtido só com agregado; nenhum valor de
              exemplo é reproduzido aqui.
            data_type: text
            tests:
              - not_null   # inferido do perfil do banco
              - unique   # inferido do perfil do banco
          - name: codigo_programa
            description: >
              Identificador: 11 valores distintos em 11 registros, sem repetição. Comprimento
              fixo de 14 caracteres. Perfil obtido só com agregado; nenhum valor de exemplo é
              reproduzido aqui.
            data_type: text
            tests:
              - not_null   # inferido do perfil do banco
              - unique   # inferido do perfil do banco
          - name: politica_publica
            description: >
              Coluna sempre nula: nenhum dos 11 registros tem valor. Candidata a remoção ou a
              investigação da extração.
            data_type: text
          - name: id_fundo_programa
            description: >
              2 valores distintos em 11 registros preenchidos de 11. Comprimento entre 3 e 5
              caracteres. Domínio fechado, com 1 valores distintos acima do limite de
              supressão. Perfil obtido só com agregado; nenhum valor de exemplo é reproduzido
              aqui.
            data_type: text
            tests:
              - not_null   # inferido do perfil do banco
          - name: objetivo_programa
            description: >
              4 valores distintos em 11 registros preenchidos de 11. Comprimento entre 65 e
              230 caracteres. Domínio fechado, com 1 valores distintos acima do limite de
              supressão. Perfil obtido só com agregado; nenhum valor de exemplo é reproduzido
              aqui.
            data_type: text
            tests:
              - not_null   # inferido do perfil do banco
          - name: situacao_programa
            description: >
              Coluna constante: um único valor distinto em 11 registros preenchidos. Não
              discrimina nada. Comprimento fixo de 15 caracteres. Domínio fechado, com 1
              valores distintos acima do limite de supressão. Perfil obtido só com agregado;
              nenhum valor de exemplo é reproduzido aqui.
            data_type: text
            tests:
              - not_null   # inferido do perfil do banco
          - name: uf_fundo_programa
            description: >
              Coluna constante: um único valor distinto em 11 registros preenchidos. Não
              discrimina nada. Comprimento fixo de 2 caracteres. Domínio fechado, com 1
              valores distintos acima do limite de supressão. Perfil obtido só com agregado;
              nenhum valor de exemplo é reproduzido aqui.
            data_type: text
            tests:
              - not_null   # inferido do perfil do banco
          - name: descricao_programa
            description: >
              8 valores distintos em 11 registros preenchidos de 11. Comprimento entre 696 e
              2141 caracteres. Perfil obtido só com agregado; nenhum valor de exemplo é
              reproduzido aqui.
            data_type: text
            tests:
              - not_null   # inferido do perfil do banco
              - unique   # inferido do perfil do banco
          - name: cnpj_fundo_programa
            description: >
              Coluna constante: um único valor distinto em 4 registros preenchidos. Não
              discrimina nada. 64% nulos. Comprimento fixo de 14 caracteres. Perfil obtido só
              com agregado; nenhum valor de exemplo é reproduzido aqui.
            data_type: text
            meta:
              openmetadata:
                tags:
                  - PII.Sensitive
          - name: modalidade_programa
            description: >
              Coluna constante: um único valor distinto em 11 registros preenchidos. Não
              discrimina nada. Comprimento fixo de 13 caracteres. Domínio fechado, com 1
              valores distintos acima do limite de supressão. Perfil obtido só com agregado;
              nenhum valor de exemplo é reproduzido aqui.
            data_type: text
            tests:
              - not_null   # inferido do perfil do banco
          - name: nome_fundo_programa
            description: >
              Coluna constante: um único valor distinto em 11 registros preenchidos. Não
              discrimina nada. Comprimento fixo de 25 caracteres. Perfil obtido só com
              agregado; nenhum valor de exemplo é reproduzido aqui.
            data_type: text
            meta:
              openmetadata:
                tags:
                  - PII.NonSensitive
            tests:
              - not_null   # inferido do perfil do banco
          - name: valor_global_programa
            description: >
              9 valores distintos em 11 registros preenchidos de 11. Comprimento entre 4 e 12
              caracteres. Perfil obtido só com agregado; nenhum valor de exemplo é
              reproduzido aqui.
            data_type: text
            tests:
              - not_null   # inferido do perfil do banco
          - name: municipio_fundo_programa
            description: >
