version: 2

sources:
  - name: bb_agil
    schema: bb_agil
    description: >
      Schema de ingestão do extrato bancário BB Gestão Ágil/SERPRO — pouso dos
      lançamentos financeiros brutos, anterior à agregação/filtragem que gera
      bsc_pnab.fato_bbagil (a fonte de fato lida pelo model, hoje desabilitado,
      stg_bbagil). Não consumido diretamente por nenhum model deste projeto.
    tables:
      - name: raw_ingestao_financeira_lancamentos
        description: >
          [Inferido do nome + do pipeline bbágil, não verificado a nível de
          coluna] Lançamentos financeiros brutos do extrato bancário, um passo
          antes da agregação em bsc_pnab.fato_bbagil.
        meta:
          used: false

          openmetadata:
            domain: Cultura.Repasse Federativo
            tier: Tier.Tier4
            owner: minc-data-engineering
  - name: bsc
    schema: bsc
    description: >
      Schema de apoio à ingestão bbágil (extrato bancário BB Gestão Ágil).
      [Descrição anterior — "contemplados, editais, instrumentos e anexos" —
      estava copiada de outro schema e não correspondia às tabelas reais aqui;
      corrigida nesta revisão.] Não consumido diretamente por nenhum model
      deste projeto.
    tables:
      - name: raw_bbagil_extrato_transacoes
        description: >
          [Inferido do nome + do pipeline bbágil, não verificado a nível de
          coluna] Transações do extrato bancário BB Gestão Ágil.
        meta:
          used: false
          openmetadata:
            domain: Cultura.Repasse Federativo
            tier: Tier.Tier4
            owner: minc-data-engineering
      - name: raw_bbagil_subtransacoes
        description: >
          [Inferido do nome + do pipeline bbágil, não verificado a nível de
          coluna] Subtransações (desdobramento/rateio) de uma transação do
          extrato BB Gestão Ágil.
        meta:
          used: false

          openmetadata:
            domain: Cultura.Repasse Federativo
            tier: Tier.Tier4
            owner: minc-data-engineering
