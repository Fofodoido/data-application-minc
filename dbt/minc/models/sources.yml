          ``id_plano_acao_dado_bancario`` + periodo tentado, com status
          ``ok``/``sem_dados``/``erro``. ``sem_dados`` cobre dois 400
          permanentes do BSC, distinguidos por ``mensagem_erro``: periodo sem
          lancamentos e conta corrente invalida. Nao entra em modelo nenhum;
          serve a quem for auditar cobertura (o que foi consultado, e nao so o
          que voltou com dado).
