name: data-application-minc

# Base configuration for Airflow services
x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: infra/docker/airflow/Dockerfile
    target: ${AIRFLOW_BUILD_TARGET:-airflow-dev}
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.2.2}
      PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
  user: "${AIRFLOW_UID:-50000}:0"
  # O .env vive na RAIZ do repo. Uma entrada so: com duas (./.env e ../.env)
  # ficava ambiguo qual valia, e a ordem de precedencia nao era obvia.
  env_file:
    - path: ../.env
      required: false
  volumes:
    - ./airflow/airflow.cfg:/opt/airflow/airflow.cfg
    - ./airflow/prune_stale_dags.py:/opt/airflow/prune_stale_dags.py:ro
    - ../dags:/opt/airflow/dags/
    - ../plugins:/opt/airflow/plugins/
    - ../helpers:/opt/airflow/helpers/
    - ../templates:/opt/airflow/templates/
    - ../dbt:/opt/airflow/dbt/
    - ../data:/opt/airflow/data/
    - ../dbt/minc/profiles.yml:/opt/airflow/.dbt/profiles.yml
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

# Common environment variables for Airflow
x-airflow-environment: &airflow-common-env
  AIRFLOW__CORE__DEFAULT_TIMEZONE: 'America/Sao_Paulo'
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  # Sem valor fixo, cada `docker compose up` sem .env pode gerar/perder uma
  # chave diferente -- e qualquer senha de Connection criptografada com a
  # chave antiga vira lixo indecifravel (foi o que corrompeu postgres_default
  # e minio_default). Default aqui e so para dev local nunca ficar vazio;
  # em producao, defina AIRFLOW__CORE__FERNET_KEY no .env e NUNCA troque sem
  # antes re-criptografar as connections existentes (`airflow rotate-fernet-key`).
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-I9n8l_FqCBVdaOEsuoAo92lCW2Qk2oSvUtaTW4OX17A=}
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  # O minc_cosmos_dag monta a DAG com `dbt ls`. Medido em 06/09/2026 nos 647
  # modelos ativos: 102s em container novo (sem partial parse) e 34s depois.
  # Os defaults -- 30s de dagbag_import_timeout, 50s de
  # dag_file_processor_timeout -- estouram nos DOIS casos e a DAG some da UI.
  # Sobem juntos porque o segundo e o teto do primeiro.
  #
  # Folga generosa de proposito: o custo de um timeout alto e so um parse
  # travado demorar mais para ser abortado, e o numero cresce com o projeto.
  AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 300
  AIRFLOW__DAG_PROCESSOR__DAG_FILE_PROCESSOR_TIMEOUT: 360
  AIRFLOW__CORE__TEST_CONNECTION: Enabled
  AIRFLOW__CORE__MAX_MAP_LENGTH: 15000
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
  # A porta e a mesma que o servico postgres publica (POSTGRES_PORT). O Airflow
  # roda em network_mode: host, entao alcanca o banco pela porta do host — se as
  # duas divergirem, ele conecta no Postgres de outro projeto que esteja na 5432.
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@localhost:${POSTGRES_PORT:-5432}/airflow
  AIRFLOW__EMAIL__DEFAULT_EMAIL_ON_RETRY: 'false'
  AIRFLOW__EMAIL__DEFAULT_EMAIL_ON_FAILURE: 'false'
  AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: 'America/Sao_Paulo'
  AIRFLOW__WEBSERVER__INSTANCE_NAME: "Ipea - Local Dev!"
  AIRFLOW__WEBSERVER__NAVBAR_COLOR: '#112130'
  AIRFLOW__WEBSERVER__RELOAD_ON_PLUGIN_CHANGE: 'true'
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:-local-dev-airflow-secret-key}
  # Sem isso, cada subprocesso do `airflow standalone` (scheduler,
  # api-server, dag-processor, triggerer) gera seu proprio jwt_secret
  # aleatorio em memoria -- o token que o scheduler assina para uma task
  # nao bate com a chave que o api-server usa para validar, e toda task
  # falha com "Invalid auth token: Signature verification failed".
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-local-dev-airflow-jwt-secret}
  PYTHONPATH: "/opt/airflow/dags:/opt/airflow/plugins:/opt/airflow/helpers"
  _AIRFLOW_DB_MIGRATE: 'true'
  AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW_REPO_BASE: /opt/airflow
  AIRFLOW_PRUNE_STALE_DAGS: ${AIRFLOW_PRUNE_STALE_DAGS:-true}
  # Feature flags da openmetadata_ingestion_dag. Superset desligada porque o
  # MinC nao tem instancia propria.
  OM_INGEST_SUPERSET: ${OM_INGEST_SUPERSET:-false}
  OM_INGEST_AIRFLOW: ${OM_INGEST_AIRFLOW:-true}
  OM_INGEST_POSTGRES: ${OM_INGEST_POSTGRES:-true}
  OM_INGEST_DBT: ${OM_INGEST_DBT:-true}
  OM_INGEST_GLOSSARY: ${OM_INGEST_GLOSSARY:-true}
  # Profiler desligado: ele publica min, max e distribuicao, que sao
  # estatisticas reveladoras num banco com CPF, CNPJ e dados de raca e
  # deficiencia. Ligue depois de verificar as exclusoes de coluna sensivel.
  OM_INGEST_PROFILER: ${OM_INGEST_PROFILER:-false}
  OM_INGEST_CLASSIFIER: ${OM_INGEST_CLASSIFIER:-true}
  # Governanca declarada em dbt/minc/governance/, testes nativos e o `dbt test`
  # que leva o resultado dos testes do dbt ao catalogo.
  OM_SYNC_GOVERNANCA: ${OM_SYNC_GOVERNANCA:-true}
  OM_INGEST_TESTSUITE: ${OM_INGEST_TESTSUITE:-true}
  OM_DBT_RUN_TESTS: ${OM_DBT_RUN_TESTS:-true}
  OM_DBT_PROJECT_DIR: ${OM_DBT_PROJECT_DIR:-dbt/minc}
  # BSC / SERPRO (bbágil) — interpoladas do .env do project dir. Passadas aqui na
  # `environment:` porque a diretiva `env_file` não injetou as vars neste setup;
  # esta via (${...}) é a mesma que já funciona p/ FERNET_KEY/JWT_SECRET acima.
  SCA_TOKEN_URL: ${SCA_TOKEN_URL:-}
  SCA_CLIENT_ID: ${SCA_CLIENT_ID:-}
  SCA_CLIENT_SECRET: ${SCA_CLIENT_SECRET:-}
  BSC_BASE_URL: ${BSC_BASE_URL:-https://bsc.cultura.gov.br}
  BSC_CPF_CONSULTA: ${BSC_CPF_CONSULTA:-}
  BSC_USUARIO: ${BSC_USUARIO:-minc.automacao}
  BSC_IP_ORIGEM: ${BSC_IP_ORIGEM:-127.0.0.1}
  BSC_IP_USUARIO: ${BSC_IP_USUARIO:-127.0.0.1}
  BSC_MAX_CONCURRENT_REQUESTS: ${BSC_MAX_CONCURRENT_REQUESTS:-5}
  BSC_REQUEST_THROTTLE_SECONDS: ${BSC_REQUEST_THROTTLE_SECONDS:-1.05}
  # A ENV AIRFLOW_REPO_BASE É IMPORTANTE PARA SINCRONIZAR COM O SISTEMA DE PASTAS
  # DO AIRFLOW EM HOMOLOG E PROD, ELES POSSUEM UMA ESTRUTURA DE PASTAS DIFERENTE
  # USAR ESSA ENV NOS CÓDIGOS PARA NÃO HAVER CONFLITOS
  
services:
  # Airflow Services
  airflow:
    <<: *airflow-common
    network_mode: "host"
    # Usamos standalone para não rodar múltiplos containers localmente.
    # A poda automática remove DAGs órfãs do metadata DB quando arquivos são apagados.
    command:
      - bash
      - -c
      - |
        set -euo pipefail

        airflow standalone &
        airflow_pid=$$!

        trap 'kill -TERM "$$airflow_pid" 2>/dev/null || true; wait "$$airflow_pid" 2>/dev/null || true' TERM INT

        if [[ "${AIRFLOW_PRUNE_STALE_DAGS:-true}" == "true" ]]; then
          for _ in {1..60}; do
            if ! kill -0 "$$airflow_pid" 2>/dev/null; then
              wait "$$airflow_pid"
              exit $?
            fi

            if curl --fail --silent http://localhost:8080/api/v2/monitor/health >/dev/null; then
              python /opt/airflow/prune_stale_dags.py || true
              break
            fi

            sleep 2
          done
        fi

        wait "$$airflow_pid"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health" ]
      interval: 10s
      timeout: 60s
      start_period: 60s
      retries: 5
    restart: always
    environment:
      <<: *airflow-common-env

  postgres:
    image: postgres:15-alpine
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-db:/var/lib/postgresql/data
      - ./docker/postgres/:/docker-entrypoint-initdb.d/
    ports:
      # Parametrizada para conviver com outro stack local ja ocupando a 5432.
      # Definida no .env da raiz (o Makefile passa --env-file .env).
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Trino — motor de consulta federada usado pela ingestão SALIC v2. Lê do SQL
  # Server e escreve no Postgres sem que o dado passe por Python: é o que
  # remove o gargalo de converter linha a linha no worker do Airflow.
  #
  # Fica atrás do profile `trino` para não entrar no `make up` do dia a dia —
  # quem não vai ingerir SALIC não precisa baixar a imagem nem manter a JVM de
  # pé. Suba com `make up-trino`.
  trino:
    image: trinodb/trino:${TRINO_VERSION:-478}
    profiles:
      - trino
    # Mesma entrada unica do x-airflow-common: o .env vive na RAIZ do repo.
    env_file:
      - path: ../.env
        required: false
    environment:
      # Destino: o Postgres deste mesmo compose, alcançado pelo nome do serviço.
      TRINO_DW_HOST: ${TRINO_DW_HOST:-postgres}
      TRINO_DW_PORT: ${TRINO_DW_PORT:-5432}
      TRINO_DW_DB: ${TRINO_DW_DB:-${POSTGRES_DB:-postgres}}
      TRINO_DW_USER: ${TRINO_DW_USER:-${POSTGRES_USER:-postgres}}
      TRINO_DW_PASSWORD: ${TRINO_DW_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      # Origem: sem default útil — os valores reais vêm do .env (gitignorado).
      # Vazio deixa o Trino subir mesmo sem VPN; a query é que falha, com erro
      # de conexão claro, em vez do container entrar em crash loop.
      SALIC_MSSQL_HOST: ${SALIC_MSSQL_HOST:-}
      SALIC_MSSQL_PORT: ${SALIC_MSSQL_PORT:-1433}
      SALIC_MSSQL_USER: ${SALIC_MSSQL_USER:-}
      SALIC_MSSQL_PASSWORD: ${SALIC_MSSQL_PASSWORD:-}
      # O SALIC roda em SQL Server antigo: encrypt=false + trustServerCertificate
      # evitam o handshake TLS que o JDBC moderno exige por padrão. É a mesma
      # razão do SECLEVEL=1 no Dockerfile do Airflow.
      SALIC_MSSQL_URL_OPTS: ${SALIC_MSSQL_URL_OPTS:-encrypt=false;trustServerCertificate=true;loginTimeout=30}
    volumes:
      - ./trino/etc:/etc/trino
    # O Airflow roda em network_mode: host e herda o resolvedor da VPN; o Trino
    # roda em bridge e NAO herda o dominio de busca. Sem isto, um SALIC_MSSQL_HOST
    # sem dominio (nome curto de servidor) nao resolve dentro do container, ainda
    # que a maquina host resolva — e o erro chega como "TCP/IP connection to the
    # host ... has failed", que parece firewall e nao e.
    #
    # Defina SALIC_DNS_SEARCH no .env da raiz com o dominio de busca da VPN. Vazio
    # tambem funciona: basta usar o FQDN em SALIC_MSSQL_HOST.
    dns_search:
      - ${SALIC_DNS_SEARCH:-localdomain}
    ports:
      # 8088 já é do Superset e 8080 é do Airflow (network_mode: host).
      - "${TRINO_PORT:-8090}:8080"
    # O heap da JVM é 80% da memória do container (ver infra/trino/etc/jvm.config),
    # então é aqui que se dimensiona o Trino — não no jvm.config.
    mem_limit: ${TRINO_MEM_LIMIT:-6g}
    # A imagem já traz HEALTHCHECK própria (/usr/lib/trino/bin/health-check).
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  airflow-mcp:
    build:
      context: ..
      dockerfile: infra/docker/airflow-mcp/Dockerfile
    profiles:
      - dev
    environment:
      AIRFLOW_API_URL: http://airflow:8080
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-airflow}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
      AF_READ_ONLY: ${AF_READ_ONLY:-false}
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      airflow:
        condition: service_healthy
    restart: always

  superset:
    build:
      context: ..
      dockerfile: infra/docker/superset/Dockerfile
    environment:
      SUPERSET_SECRET_KEY: 'supersetadmin'
      SUPERSET_ENV: development
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/superset
    ports:
      - "8088:8088"
    depends_on:
      - postgres
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      /bin/sh -c "
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.com --password admin &&
      superset db upgrade &&
      superset init &&
      superset run -p 8088 -h 0.0.0.0 --with-threads --reload --debugger
      "

  minio:
    image: minio/minio:RELEASE.2023-06-19T19-52-50Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # A imagem do servidor minio NÃO inclui o binário `mc` (mc vive em minio/mc),
      # então o healthcheck antigo dava `mc: command not found` (exit 127) e o
      # container ficava eternamente unhealthy. curl existe na imagem e o endpoint
      # /minio/health/live responde 200 quando o servidor está no ar.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Creates the landing zone bucket on first start
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/$${RAW_STORAGE_CONTAINER:-data-lake-ipea} &&
      echo 'Bucket ready.'
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      RAW_STORAGE_CONTAINER: ${RAW_STORAGE_CONTAINER:-data-lake-ipea}
      MINIO_BUCKET: ${MINIO_BUCKET:-${RAW_STORAGE_CONTAINER:-data-lake-ipea}}

volumes:
  postgres-db:
  minio-data:
